# Security scans before merging to main: run on PR/push to develop and main.
# Fix or acknowledge any reported vulnerabilities before merging develop → main.

name: Security

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  govulncheck:
    name: Go vulnerabilities
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  grype:
    name: Grype (container image)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build timestamp
        id: ts
        run: echo "b=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: gghstats:scan
          file: ./Dockerfile
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILDDATE=${{ steps.ts.outputs.b }}

      # Pin Grype image tag (Dependabot docker ecosystem can refresh).
      - name: Run Grype on image
        run: |
          docker run --rm --pull=always \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.122.1 \
            gghstats:scan --fail-on high
